<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mi Kanban</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f2f2f7" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mi Kanban" />

<link rel="icon" href="assets/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />

<!-- Aplica el tema guardado ANTES de pintar, para evitar un destello blanco.
     La lógica completa del tema vive en js/ui/theme.js. -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("kanban-theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<!-- ===================== PANTALLA DE LOGIN ===================== -->
<section id="login-screen" class="screen">
  <div class="login-card">
    <img src="assets/logo.svg" alt="Mi Kanban" class="brand-logo login-logo" />
    <h1 class="login-title">Mi Kanban</h1>
    <p class="login-subtitle" id="app-name-slot">Organiza tus pendientes</p>

    <form id="login-form" autocomplete="on">
      <div class="input-group">
        <input class="input" type="email" id="login-email" required autocomplete="username" placeholder="Correo" aria-label="Correo" />
        <input class="input" type="password" id="login-password" required autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" />
      </div>
      <p id="login-error" class="error-text" hidden></p>
      <button type="submit" id="login-btn" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <footer class="login-footer">
      <p>Desarrollado por: <strong>Ing. Luis Ángel Díaz Bernal</strong></p>
      <p>Compañía: <strong>CODE-RESET</strong></p>
    </footer>
  </div>
</section>

<!-- ===================== SHELL DE LA APP ===================== -->
<section id="app-shell" class="screen" hidden>
  <header class="app-header">
    <button id="menu-btn" class="header-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="app-drawer"></button>
    <img src="assets/logo.svg" alt="Mi Kanban" class="brand-logo header-logo" />
    <span class="header-name">Mi Kanban</span>
    <button id="theme-btn" class="header-btn" aria-label="Cambiar tema"></button>
  </header>

  <!-- ===================== MENÚ HAMBURGUESA ===================== -->
  <!-- Va fuera del header: su backdrop-filter rompería el position: fixed. -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <aside id="app-drawer" class="drawer" aria-hidden="true" aria-label="Menú">
    <div class="drawer-head">
      <img src="assets/logo.svg" alt="" class="brand-logo drawer-logo" />
      <div>
        <p class="drawer-title">Mi Kanban</p>
        <p class="drawer-email" id="drawer-email"></p>
      </div>
    </div>

    <!-- router.js pinta aquí los links según los módulos registrados -->
    <nav id="app-nav" class="drawer-nav"></nav>

    <div class="drawer-section">
      <label class="drawer-row">
        <span>Modo oscuro</span>
        <span class="switch">
          <input type="checkbox" id="drawer-theme-switch" />
          <span class="switch-track"></span>
        </span>
      </label>
      <button class="drawer-row destructive" id="drawer-logout">Cerrar sesión</button>
    </div>

    <footer class="drawer-footer">
      <p>Desarrollado por: <strong>Ing. Luis Ángel Díaz Bernal</strong></p>
      <p>Compañía: <strong>CODE-RESET</strong></p>
    </footer>
  </aside>

  <main id="app-content" class="app-content">
    <!-- router.js inyecta aquí la vista activa -->
  </main>
</section>

<script type="module" src="js/router.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/ui/drawer.js"></script>
<script type="module" src="js/ui/brand.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.warn('Service worker no registrado:', err);
      });
    });
  }
</script>
</body>
</html>
