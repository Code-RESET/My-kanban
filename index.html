<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mi Kanban</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mi Kanban" />

<link rel="icon" href="assets/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ===================== PANTALLA DE LOGIN ===================== -->
<section id="login-screen" class="screen">
  <div class="login-card">
    <img src="assets/logo.svg" alt="Code-Reset" class="login-logo" />
    <h1 class="login-title">Mi Kanban</h1>
    <p class="login-subtitle" id="app-name-slot">Organiza tus pendientes</p>

    <form id="login-form" autocomplete="on">
      <div class="input-group">
        <input class="input" type="email" id="login-email" required autocomplete="username" placeholder="Correo" aria-label="Correo" />
        <input class="input" type="password" id="login-password" required autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" />
      </div>
      <p id="login-error" class="error-text" hidden></p>
      <button type="submit" id="login-btn" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <footer class="login-footer">
      <p>Desarrollado por: <strong>Ing. Luis Ángel Díaz Bernal</strong></p>
      <p>Compañía: <strong>CODE-RESET</strong></p>
    </footer>
  </div>
</section>

<!-- ===================== SHELL DE LA APP ===================== -->
<section id="app-shell" class="screen" hidden>
  <header class="app-header">
    <img src="assets/logo.svg" alt="Code-Reset" class="header-logo" />
    <span class="header-name">Mi Kanban</span>
  </header>

  <!-- router.js pinta las pestañas según los módulos registrados.
       En PC se ven arriba a la derecha; en teléfono abajo, como en iOS.
       Va fuera del header: su backdrop-filter rompería el position: fixed. -->
  <nav id="app-nav" class="tab-bar"></nav>

  <main id="app-content" class="app-content">
    <!-- router.js inyecta aquí la vista activa -->
  </main>
</section>

<script type="module" src="js/router.js"></script>
<script type="module" src="js/auth.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.warn('Service worker no registrado:', err);
      });
    });
  }
</script>
</body>
</html>
